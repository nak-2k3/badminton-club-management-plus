spring.application.name=clubmanagement

# ===== Database (MySQL) =====
# Mat khau KHONG ghi truc tiep o day - dat bien moi truong DB_PASSWORD (va DB_USERNAME neu khong dung root)
spring.datasource.url=jdbc:mysql://localhost:3306/badminton_club_plus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
# Schema do database/schema.sql quan ly -> chi kiem tra, khong tu sinh/sua bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===== JWT =====
# Gia tri mac dinh chi dung khi phat trien. Khi trien khai that: dat bien moi truong JWT_SECRET (>= 32 ky tu)
app.jwt.secret=${JWT_SECRET:dev-only-secret-badminton-club-change-me-2026}
app.jwt.expiration-minutes=480

# ===== CORS (frontend Vite) =====
app.cors.allowed-origins=http://localhost:5173

# ===== Tai khoan admin tao tu dong khi bang users con trong =====
app.admin.email=${ADMIN_EMAIL:admin@badmintonclub.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
